name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/validate.yml

  release:
    needs: tests
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check CARD_VERSION against the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(grep -m1 -oP "^const CARD_VERSION = '\K[^']+" dist/busch-lightcards.js)"
          echo "tag=$TAG file=$FILE_VERSION"
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "::error::CARD_VERSION ($FILE_VERSION) does not match the tag ($TAG)."
            exit 1
          fi

      - name: SHA-256 checksum
        run: cd dist && sha256sum busch-lightcards.js > busch-lightcards.js.sha256 && cat busch-lightcards.js.sha256

      - name: Create release with the card as asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/busch-lightcards.js
            dist/busch-lightcards.js.sha256
          generate_release_notes: true
