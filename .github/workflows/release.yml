name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CARD_VERSION against the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(grep -m1 -oP "^const CARD_VERSION = '\K[^']+" dist/busch-lightcards.js)"
          echo "tag=$TAG file=$FILE_VERSION"
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "::error::CARD_VERSION ($FILE_VERSION) does not match the tag ($TAG)."
            exit 1
          fi

      - name: Create release with the card as asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/busch-lightcards.js
          generate_release_notes: true
